name: Build LKM (KagamiChihiro 5.10.252 target)

# Module must match the target kernel EXACTLY (else insmod refuses; -f on a
# mismatched module is what panics phones). Recipe, verified against the
# target's /proc/config.gz + vermagic + live OPP tables:
# - base: android12-5.10-2026-04 = 5.10.252, EXTRAVERSION empty (matches)
# - FULL kernel build with configs/kagami-5.10.252.config (verbatim target
#   config, unknown MTK opts dropped by olddefconfig). The full build is
#   required: core symbol CRCs (module_layout/printk/param_ops_ulong) only
#   exist after vmlinux+modules, modules_prepare does NOT generate them.
# - LOCALVERSION=+ on the cmdline
#   (reproduces the trailing '+' the target build has)
# - gpufreq_* CRCs: configs/kagami-5.10.252.symvers (MTK symbols are not in
#   the common tree; CRCs extracted from the on-device vendor modules,
#   same MTK driver source as the target's DLKM)
# - plain insmod only, NEVER -f: every mismatch then fails cleanly on
#   device instead of panicking.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libdwarf-dev \
            dwarves clang lld llvm git make gcc-aarch64-linux-gnu

      - name: Clone GKI common (android12-5.10-2026-04 = 5.10.252)
        run: |
          git clone --depth 1 -b android12-5.10-2026-04 \
            https://android.googlesource.com/kernel/common kernel-common
          cd kernel-common
          git log --oneline -1
          head -5 Makefile

      - name: Full kernel build (verbatim target config)
        run: |
          cd kernel-common
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LOCALVERSION=+
          cp $GITHUB_WORKSPACE/configs/kagami-5.10.252.config .config
          # Target config points TRIM_UNUSED_KSYMS whitelist at the kernel
          # builder's local path (/home/crazyjoker/millennium/...), missing
          # here. Empty whitelist is fine: it only affects export trimming,
          # not struct layout or symbol CRCs.
          : > $GITHUB_WORKSPACE/abi_whitelist.empty
          ./scripts/config --set-str CONFIG_UNUSED_KSYMS_WHITELIST $GITHUB_WORKSPACE/abi_whitelist.empty
          # TRIM with the (empty) whitelist strips printk/param_ops_ulong out
          # of Module.symvers, which our module needs versions for. Disabling
          # TRIM changes neither struct layout nor symbol CRCs (it only
          # controls which exports land in the final ksymtab).
          ./scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          # Target runs FULL preempt (vermagic "SMP PREEMPT"); make sure the
          # choice survived olddefconfig (Kagami Kconfig drifts can flip it
          # to voluntary, which changes vermagic AND struct layout).
          ./scripts/config --disable CONFIG_PREEMPT_NONE --disable CONFIG_PREEMPT_VOLUNTARY --enable CONFIG_PREEMPT
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -q "^CONFIG_PREEMPT=y" .config || { echo "full PREEMPT lost:"; grep -E "PREEMPT" .config; exit 1; }
          grep -q "CONFIG_PREEMPT_VOLUNTARY=y" .config && { echo "voluntary PREEMPT set, wrong"; exit 1; } || true
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc)
          cat include/generated/utsrelease.h
          echo "--- post-make PREEMPT check (fail fast, with data) ---"
          grep -E "PREEMPT" .config | head -8
          grep -E "PREEMPT" include/generated/autoconf.h | head -8
          grep -q "#define CONFIG_PREEMPT 1" include/generated/autoconf.h \
            || { echo "PREEMPT lost during make (see above)"; exit 1; }
          echo "--- core CRCs from the full build (must match target) ---"
          grep -E "^(0x[0-9a-f]+.*(module_layout|printk|param_ops_ulong))" Module.symvers

      - name: Build all 15 variants
        run: |
          mkdir -p dist
          for f in 1200 1250 1300 1350 1400 1450 1500 1550 1600 1650 1700 1750 1800 1850 1900; do
            python3 tools/gen_opp.py $f > src/opp_table.h
            make -s -C kernel-common ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
              LOCALVERSION=+ M=$GITHUB_WORKSPACE \
              KBUILD_EXTRA_SYMBOLS=$GITHUB_WORKSPACE/configs/kagami-5.10.252.symvers \
              KBUILD_MODPOST_WARN=1 modules
            llvm-strip --strip-debug src/gpu_uvoc_mt6789.ko || true
            # Kagami's uname reports uppercase PREEMPT, but its 5.10 module
            # loader expects the lowercase token emitted by vermagic.h.
            modinfo src/gpu_uvoc_mt6789.ko | grep -F "5.10.252-KagamiChihiro-v2.0-MillenniumTeam+ SMP preempt mod_unload modversions aarch64" \
              || { echo "variant $f: vermagic mismatch"; modinfo src/gpu_uvoc_mt6789.ko | grep vermagic; exit 1; }
            # 5.10 emits U printk; 5.11+ emits U _printk. Allow both.
            undef=$(nm src/gpu_uvoc_mt6789.ko | grep " U " | grep -v -E " (_printk|printk|memcpy|_fortify_panic)|gpufreq_get_(working_table|opp_num)|param_ops_ulong|module_layout" || true)
            [ -z "$undef" ] || { echo "variant $f foreign undef: $undef"; exit 1; }
            echo "--- variant $f versions (all 6 imports must have CRCs) ---"
            python3 -c "
          import struct,subprocess,re
          f='src/gpu_uvoc_mt6789.ko'
          out=subprocess.run(['readelf','-SW',f],capture_output=True,text=True).stdout
          m=re.search(r'__versions\s+\w+\s+[0-9a-f]+\s+([0-9a-f]+)\s+([0-9a-f]+)',out)
          assert m, 'no __versions section'
          off,sz=int(m.group(1),16),int(m.group(2),16)
          data=open(f,'rb').read()[off:off+sz]
          got={}; i=0
          while i+64<=len(data):
              crc=struct.unpack_from('<Q',data,i)[0]
              got[data[i+8:i+64].split(b'\x00')[0].decode()]=crc; i+=64
          need=['module_layout','printk','param_ops_ulong','memcpy','gpufreq_get_working_table','gpufreq_get_opp_num']
          missing=[s for s in need if s not in got]
          print(got)
          assert not missing, f'missing versions: {missing}'
          "
            mv src/gpu_uvoc_mt6789.ko dist/gpu_uvoc_mt6789_${f}-kagami.ko
            echo "OK $f"
          done
          python3 tools/gen_opp.py 1200 > src/opp_table.h # default = tested variant
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: gpu_uvoc_mt6789-kagami-5.10.252-all
          path: dist/gpu_uvoc_mt6789_*-kagami.ko
